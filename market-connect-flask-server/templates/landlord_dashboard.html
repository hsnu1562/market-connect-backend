<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>S-Market | 房東管理中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-paper: #fcfaf2; /* 💡 靈魂：高雅的復古再生紙米白色 */
            --text-charcoal: #161616; /* 高級深炭黑 */
            --border-line: #161616;
            --deep-pink: #c96f8a; /* 莫蘭迪復古粉 */
        }
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background: var(--bg-paper); 
            margin: 0; 
            color: var(--text-charcoal); 
        }

        /* 💡 頂部老雜誌風格的黑底白字導航列 */
        .navbar {
            background: var(--text-charcoal); padding: 15px 50px; display: flex;
            justify-content: space-between; align-items: center; color: var(--bg-paper);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000;
        }
        .navbar .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; font-style: italic; color: var(--bg-paper); text-decoration: none; }
        .user-info span b { color: #f3c1cf; margin: 0 5px; }

        .container { max-width: 1000px; margin: 50px auto; padding: 0 20px; }

        /* 大標題排版優化 */
        h2.section-main-title {
            font-family: 'Playfair Display', 'Noto Sans TC', serif;
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: -1px;
            position: relative;
        }
        h2.section-main-title::after {
            content: ''; display: block; width: 80px; height: 2px; background: var(--text-charcoal); margin: 15px auto 0 auto;
        }

        /* 💡 核心優化：四大區域選擇框改為俐落的雙欄橫向直角格子 */
        .region-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 50px; 
        }
        @media (max-width: 768px) {
            .region-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .region-card {
            background: white; border: 1px solid var(--border-line); border-radius: 0px; padding: 30px 20px; text-align: center;
            cursor: pointer; transition: all 0.3s ease; box-shadow: none;
        }
        .region-card:hover { transform: translateY(-3px); border-color: var(--text-charcoal); background: var(--bg-paper); }
        .region-card.active { border: 2px solid var(--border-line); background: #faf9f2; font-weight: bold; box-shadow: inset 0 0 0 1px var(--text-charcoal); }
        .region-card .icon { font-size: 32px; margin-bottom: 10px; display: block; filter: grayscale(0.3); }
        .region-card h3 { font-family: 'Playfair Display', 'Noto Sans TC', serif; font-size: 1.25rem; margin: 0 0 8px 0; color: var(--text-charcoal); }
        .region-card small { color: #555; font-weight: 600; display: block; font-size: 0.85rem; }

        /* 💡 表單區域徹底線條化，去除圓角發光 */
        .form-section { 
            background: white; padding: 45px 40px; border: 2px solid var(--border-line); border-radius: 0px; 
            box-shadow: none; max-width: 800px; margin: 0 auto 60px auto;
            display: none; 
            animation: fadeIn 0.5s;
        }
        .form-section.show { display: block; }
        
        .form-group { margin-bottom: 25px; }
        .form-section h2 { font-family: 'Playfair Display', 'Noto Sans TC', serif; font-size: 1.8rem; font-weight: 900; border-bottom: 1px solid var(--border-line); padding-bottom: 12px; margin-top: 0; margin-bottom: 30px; }
        
        label { display: block; font-family: 'Playfair Display', 'Noto Sans TC', serif; margin-bottom: 10px; font-weight: 700; color: var(--text-charcoal); font-size: 1.05rem; }
        input, select, textarea { 
            width: 100%; padding: 14px; border: 1px solid var(--border-line); border-radius: 0px; 
            font-size: 1rem; box-sizing: border-box; font-family: inherit; background-color: var(--bg-paper);
            color: var(--text-charcoal); outline: none; transition: all 0.2s ease;
        }
        input:focus, select:focus, textarea:focus { background-color: #ffffff; border: 2px solid var(--border-line); }
        textarea { resize: vertical; }

        /* 表單內部的行政區網格按鈕 */
        .dist-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; 
            max-height: 200px; overflow-y: auto; padding: 12px; border: 1px solid var(--border-line); border-radius: 0px; background: #ffffff;
        }
        @media (max-width: 576px) { .dist-grid { grid-template-columns: repeat(2, 1fr); } }
        .dist-btn { padding: 10px 5px; background: var(--bg-paper); border: 1px solid var(--border-line); border-radius: 0px; cursor: pointer; font-size: 0.85rem; font-weight: 700; color: var(--text-charcoal); }
        .dist-btn.active { background: var(--text-charcoal); color: white; border-color: var(--text-charcoal); }

        /* 滿色深色雜誌風發佈按鈕 */
        .submit-btn { width: 100%; padding: 18px; background: var(--text-charcoal); color: var(--bg-paper); border: 2px solid var(--text-charcoal); border-radius: 0px; cursor: pointer; font-size: 1.15rem; font-weight: bold; letter-spacing: 2px; margin-top: 20px; transition: all 0.3s ease; }
        .submit-btn:hover { background: var(--deep-pink); border-color: var(--deep-pink); color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/landlord/hub/{{ user.id }}/" class="logo">✨ SMARKET</a>
    <div class="user-info">
        <span>👤 帳號: <b>{{ user.username }}</b></span>
        <span>🏷️ 角色: <b>{{ user.role }}</b></span>
        <span>⭐ 評分: <b>{{ user.reputation_score }} ★</b></span>
    </div>
</nav>

<div class="container">
    <h2 class="section-main-title">第一步：選擇攤位所屬區域</h2>
    
    <!-- 💡 核心變更：保留卡片點選，移除所有地圖元件 -->
    <div class="region-grid">
        <div class="region-card" onclick="selectRegion('North', this)">
            <span class="icon">❤️</span>
            <h3>北部地區</h3>
            <small>基北北桃竹宜</small>
        </div>
        <div class="region-card" onclick="selectRegion('Central', this)">
            <span class="icon">💛</span>
            <h3>中部地區</h3>
            <small>苗中彰投雲</small>
        </div>
        <div class="region-card" onclick="selectRegion('South', this)">
            <span class="icon">💚</span>
            <h3>南部地區</h3>
            <small>嘉南高屏澎</small>
        </div>
        <div class="region-card" onclick="selectRegion('East', this)">
            <span class="icon">🩵</span>
            <h3>東部與離島</h3>
            <small>花東金馬</small>
        </div>
    </div>

    <div id="stall-form-section" class="form-section">
        <h2 id="form-title">🏗️ 填寫攤位詳細資訊</h2>
        <form method="POST">
            <div class="form-group">
                <label>📍 攤位名稱</label>
                <input type="text" name="loc_name" placeholder="請填寫您的攤位黃金名稱..." required>
            </div>

            <div class="form-group">
                <label>1. 選擇縣市</label>
                <select id="city-select" name="city" onchange="updateDistricts()" required>
                    <option value="">-- 請先點選上方區域 --</option>
                </select>
            </div>

            <div id="dist-group" class="form-group" style="display:none;">
                <label>2. 選擇行政區</label>
                <div id="dist-container" class="dist-grid"></div>
                <input type="hidden" id="dist-input" name="district">
            </div>

            <div id="road-group" class="form-group" style="display:none;">
                <label>3. 選擇道路</label>
                <input type="text" id="road-input" name="road" placeholder="例如：中山路、中正路" required>
            </div>

            <div class="form-group">
                <label>4. 門牌 / 詳細地址</label>
                <input type="text" name="address_detail" placeholder="例如：100號" required>
            </div>
            
            <div class="form-group">
                 <label>5. 設施與特色描述</label>
                 <textarea name="facilities" rows="4" placeholder="請詳細描述您提供的硬體設施或攤位環境特色..."></textarea>
            </div>
            <button type="submit" class="submit-btn">🚀 立即發佈攤位</button>
        </form>
    </div>
</div>

function selectRegion(regionKey, cardElement) {
    // 切換卡片選取狀態
    document.querySelectorAll('.region-card').forEach(c => c.classList.remove('active'));
    if (cardElement) { cardElement.classList.add('active'); }
    
    // 顯示表單區塊
    document.getElementById('stall-form-section').classList.add('show');
    
    // 更新縣市選單
    const citySelect = document.getElementById('city-select');
    citySelect.length = 1; // 清空舊選項
    regions[regionKey].forEach(city => { citySelect.options.add(new Option(city, city)); });
    
    // 隱藏行政區與道路，等使用者選縣市
    document.getElementById('dist-group').style.display = 'none';
    document.getElementById('road-group').style.display = 'none';
}

function updateDistricts() {
    const cityName = document.getElementById('city-select').value;
    const distGroup = document.getElementById('dist-group');
    const container = document.getElementById('dist-container');
    if (!cityName) return;
    
    distGroup.style.display = 'block'; 
    container.innerHTML = '';
    document.getElementById('road-group').style.display = 'none';
    
    const dists = db[cityName] || {};
    for (let dist in dists) {
        const btn = document.createElement('button'); 
        btn.type = "button"; 
        btn.className = "dist-btn"; 
        btn.innerText = dist;
        btn.onclick = () => selectDist(cityName, dist, btn); 
        container.appendChild(btn);
    }
}

function selectDist(cityName, distName, btn) {
    document.querySelectorAll('.dist-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); 
    document.getElementById('dist-input').value = distName;
    document.getElementById('road-group').style.display = 'block';
}
</script>
