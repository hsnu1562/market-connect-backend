<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>SPACIS | 預約結帳單</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,900;1,400&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-paper: #fcfaf2;
            --text-charcoal: #161616;
            --border-line: #161616;
            --tenant-accent: #4a617c;
        }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-paper); margin: 0; color: var(--text-charcoal); }

        .payment-container {
            width: 90%; max-width: 700px;
            margin: 60px auto; padding: 50px;
            background: white; border: 3px solid var(--border-line);
            border-radius: 0px;
        }

        .payment-header { text-align: center; margin-bottom: 40px; }
        .payment-header h2 { font-family: 'Playfair Display', serif; font-size: 3rem; font-style: italic; margin-bottom: 10px; border-bottom: 2px solid var(--border-line); padding-bottom: 10px; }

        .summary-card { border: 1px solid #ddd; padding: 25px; margin-bottom: 30px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .total-row { border-top: 2px solid var(--border-line); padding-top: 20px; font-weight: 900; font-size: 1.5rem; }

        .payment-methods-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .method-card { border: 2px solid #ddd; padding: 20px; cursor: pointer; text-align: center; }
        .method-card.selected { border-color: var(--tenant-accent); background: #f0f4f8; }

        /* 恢復輸入框樣式 */
        .cc-form { border: 1px solid #ddd; padding: 20px; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; box-sizing: border-box; }

        .ok-btn {
            width: 100%; padding: 20px; background: var(--text-charcoal); color: white;
            border: none; font-weight: 900; font-size: 1.2rem; cursor: pointer;
            transition: 0.3s;
        }
        .ok-btn:hover { background: var(--tenant-accent); }
    </style>
</head>
<body>

<div class="payment-container">
    <div class="payment-header">
        <h2>結帳單 (Invoice)</h2>
    </div>

    <div class="summary-card">
        <div style="font-weight: 700; margin-bottom: 15px;">📝 訂單編號: {{ qr_code }}</div>
        <div class="summary-row"><span>租借攤位</span> <strong>{{ stall.loc_name }}</strong></div>
        <div class="summary-row total-row"><span>總計</span> <span>${{ total_price }}</span></div>
    </div>

    <form action="/process_payment/" method="POST">        <input type="hidden" name="qr_code" value="{{ qr_code }}">
        
        <div class="payment-methods-grid">
            <div class="method-card selected" id="card-method" onclick="togglePayment('Credit Card')">
                <div style="font-size: 2rem;">💳</div>
                <div>信用卡</div>
            </div>
            <div class="method-card" id="cash-method" onclick="togglePayment('Cash')">
                <div style="font-size: 2rem;">💵</div>
                <div>現場現金</div>
            </div>
        </div>
        
        <!-- 模擬輸入欄位 -->
        <div id="cc-fields" class="cc-form">
            <div class="form-group">
                <label>卡號 (Card Number)</label>
                <input type="text" placeholder="4000 1234 5678 9010" value="4000 1234 5678 9010">
            </div>
            <div class="form-group">
                <label>有效期限 (MM/YY)</label>
                <input type="text" placeholder="12/29" value="12/29">
            </div>
        </div>

        <input type="hidden" name="payment_method" id="payment_method" value="Credit Card">
        <button type="submit" class="ok-btn">確認預約 (Confirm Payment)</button>
    </form>
</div>

<script>
    function togglePayment(method) {
        document.getElementById('payment_method').value = method;
        document.getElementById('cc-fields').style.display = (method === 'Credit Card') ? 'block' : 'none';
        document.getElementById('card-method').classList.toggle('selected', method === 'Credit Card');
        document.getElementById('cash-method').classList.toggle('selected', method === 'Cash');
    }
</script>
</body>
</html>
