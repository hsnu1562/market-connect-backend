<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPACIS | 預約結帳單</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,900;1,400&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='member-nav.css') }}">
    <style>
        :root {
            --bg-paper: #fcfaf2;
            --text-charcoal: #161616;
            --border-line: #161616;
            --tenant-accent: #4a617c;
        }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-paper); margin: 0; color: var(--text-charcoal); }

        .payment-container {
            width: 90%; max-width: 700px;
            margin: 60px auto; padding: 50px;
            background: white; border: 3px solid var(--border-line);
            border-radius: 0px;
            box-sizing: border-box;
        }

        .payment-header { text-align: center; margin-bottom: 40px; }
        .payment-header h2 { font-family: 'Playfair Display', serif; font-size: 3rem; font-style: italic; margin-bottom: 10px; border-bottom: 2px solid var(--border-line); padding-bottom: 10px; }

        .summary-card { border: 1px solid #ddd; padding: 25px; margin-bottom: 30px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .total-row { border-top: 2px solid var(--border-line); padding-top: 20px; font-weight: 900; font-size: 1.5rem; }

        .payment-methods-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 24px; }
        .method-card { border: 2px solid #ddd; padding: 20px; text-align: center; }
        .method-card.selected { border-color: var(--tenant-accent); background: #f0f4f8; }
        .gateway-notice {
            margin-bottom: 30px;
            padding: 16px 18px;
            border-left: 5px solid #c7942f;
            background: #fff9e8;
            line-height: 1.7;
            font-size: 0.9rem;
        }

        .ok-btn {
            width: 100%; padding: 20px; background: var(--text-charcoal); color: white;
            border: none; font-weight: 900; font-size: 1.2rem; cursor: pointer;
            transition: 0.3s;
        }
        .ok-btn:hover { background: var(--tenant-accent); }

        @media (max-width: 620px) {
            .payment-container { width: calc(100% - 28px); margin: 28px auto; padding: 28px 18px; }
            .payment-header h2 { font-size: 2.2rem; }
            .payment-methods-grid { grid-template-columns: 1fr; gap: 12px; }
        }
    </style>
</head>
<body>
{% set nav_active = 'tenant' %}
{% include '_member_nav.html' %}

<div class="payment-container">
    <div class="payment-header">
        <h2>結帳單 (Invoice)</h2>
    </div>

    <div class="summary-card">
        <div style="font-weight: 700; margin-bottom: 15px;">📝 訂單編號: {{ qr_code }}</div>
        <div class="summary-row"><span>租借攤位</span> <strong>{{ stall.loc_name }}</strong></div>
        <div class="summary-row total-row"><span>總計</span> <span>${{ total_price }}</span></div>
    </div>

    <form action="/process_payment/" method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="qr_code" value="{{ qr_code }}">
        
        <div class="payment-methods-grid">
            <div class="method-card selected">
                <div style="font-size: 2rem;">💳</div>
                <div><strong>線上信用卡付款</strong></div>
                <small>目前唯一支援的付款方式</small>
            </div>
        </div>

        <div class="gateway-notice" role="note">
            <strong>MVP 測試付款流程</strong><br>
            尚未串接正式金流，因此本頁不會要求或傳送真實卡號。按下確認後只會在 SPACIS 測試系統內將訂單標記為已付款；正式上線前必須接入合規金流服務。
        </div>

        <input type="hidden" name="payment_method" value="{{ online_payment_method }}">
        <button type="submit" class="ok-btn">確認線上付款（MVP）</button>
    </form>
</div>
</body>
</html>
